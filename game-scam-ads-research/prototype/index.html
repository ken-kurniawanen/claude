<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Crowd Runner - Scam Ad Game Prototype</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }
        #menu h1 {
            font-size: 32px;
            margin-bottom: 5px;
            text-align: center;
            background: linear-gradient(135deg, #ff6b6b, #ffa500, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #menu p {
            color: #888;
            font-size: 14px;
            text-align: center;
            max-width: 320px;
            line-height: 1.5;
        }
        .play-btn {
            width: 280px;
            padding: 22px;
            border: none;
            border-radius: 16px;
            font-size: 22px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
            margin-top: 20px;
        }
        .play-btn:active { transform: scale(0.95); }
        .play-btn .subtitle {
            font-size: 13px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 6px;
        }
        .info {
            color: #555;
            font-size: 11px;
            text-align: center;
            max-width: 280px;
            line-height: 1.4;
            margin-top: 10px;
        }
        canvas {
            display: block;
            background: #222;
        }
        #back-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Crowd Runner</h1>
        <p>A prototype of the classic mobile game scam ad. Run through gates to grow your army, then battle the horde!</p>
        <button class="play-btn" id="btn-play">
            PLAY
            <div class="subtitle">Gates + Battle in one run</div>
        </button>
        <div class="info">Based on Last War / Last Z style misleading mobile game ads</div>
    </div>
    <button id="back-btn">&larr;</button>
    <canvas id="gameCanvas"></canvas>

    <script src="crowd-runner.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const backBtn = document.getElementById('back-btn');

        let currentGame = null;
        let animFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function showMenu() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (currentGame && currentGame.cleanup) currentGame.cleanup();
            currentGame = null;
            menu.style.display = 'flex';
            canvas.style.display = 'none';
            backBtn.style.display = 'none';
        }

        function startGame() {
            menu.style.display = 'none';
            canvas.style.display = 'block';
            backBtn.style.display = 'block';
            resizeCanvas();
            currentGame = createCrowdRunner(canvas, ctx);
            gameLoop();
        }

        function gameLoop() {
            if (!currentGame) return;
            currentGame.update();
            currentGame.draw();
            animFrameId = requestAnimationFrame(gameLoop);
        }

        document.getElementById('btn-play').addEventListener('click', startGame);
        backBtn.addEventListener('click', showMenu);

        showMenu();
    </script>
</body>
</html>
