<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobile Game Prototypes</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            touch-action: none;
            height: 100vh;
            width: 100vw;
        }
        #menu {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 20px;
        }
        #menu h1 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
            background: linear-gradient(135deg, #ff6b6b, #ffa500, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #menu p {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .menu-btn {
            width: 280px;
            padding: 20px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s;
            text-align: left;
        }
        .menu-btn:active { transform: scale(0.95); }
        .menu-btn .subtitle {
            font-size: 12px;
            font-weight: 400;
            opacity: 0.8;
            margin-top: 4px;
        }
        #btn-horde {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            color: #fff;
        }
        #btn-gate {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: #fff;
        }
        canvas {
            display: block;
            background: #222;
        }
        #back-btn {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 100;
            background: rgba(0,0,0,0.6);
            border: none;
            color: #fff;
            font-size: 22px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <div id="menu">
        <h1>Game Ad Prototypes</h1>
        <p>The games from the "scam" ads</p>
        <button class="menu-btn" id="btn-horde">
            Horde Shooter
            <div class="subtitle">Shoot waves of enemies marching toward you</div>
        </button>
        <button class="menu-btn" id="btn-gate">
            Number Gate Runner
            <div class="subtitle">Run your army through +/- gates to grow</div>
        </button>
    </div>
    <button id="back-btn">&larr;</button>
    <canvas id="gameCanvas"></canvas>

    <script src="horde-shooter.js"></script>
    <script src="gate-runner.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const menu = document.getElementById('menu');
        const backBtn = document.getElementById('back-btn');

        let currentGame = null;
        let animFrameId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function showMenu() {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            currentGame = null;
            menu.style.display = 'flex';
            canvas.style.display = 'none';
            backBtn.style.display = 'none';
        }

        function startGame(gameFactory) {
            menu.style.display = 'none';
            canvas.style.display = 'block';
            backBtn.style.display = 'block';
            resizeCanvas();
            currentGame = gameFactory(canvas, ctx);
            gameLoop();
        }

        function gameLoop() {
            if (!currentGame) return;
            currentGame.update();
            currentGame.draw();
            animFrameId = requestAnimationFrame(gameLoop);
        }

        document.getElementById('btn-horde').addEventListener('click', () => startGame(createHordeShooter));
        document.getElementById('btn-gate').addEventListener('click', () => startGame(createGateRunner));
        backBtn.addEventListener('click', showMenu);

        showMenu();
    </script>
</body>
</html>
